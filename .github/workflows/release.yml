name: Release

# Push a tag like v0.1.0 to build Lampion for every platform and publish a GitHub release.
# Tags with a suffix (v0.2.0-beta.1) are published as pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Lampion.Core.Tests -c Release

  build:
    name: Build ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: windows-latest, rid: win-arm64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
          - { os: macos-latest, rid: osx-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: >
          dotnet publish src/Lampion.App -c Release -r ${{ matrix.rid }} --self-contained
          -p:Version=${{ steps.version.outputs.version }}
          -p:DebugType=none
          -o publish

      - name: Package (Windows)
        if: startsWith(matrix.rid, 'win')
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "Lampion-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip"

      - name: Package (Linux)
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          chmod +x publish/Lampion
          mv publish "Lampion-${{ steps.version.outputs.version }}"
          tar -czf "Lampion-${{ steps.version.outputs.version }}-${{ matrix.rid }}.tar.gz" "Lampion-${{ steps.version.outputs.version }}"

      - name: Package (macOS app bundle)
        if: startsWith(matrix.rid, 'osx')
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          app="Lampion.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R publish/. "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/Lampion"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Lampion</string>
            <key>CFBundleDisplayName</key><string>Lampion</string>
            <key>CFBundleIdentifier</key><string>io.github.arukosakai.lampion</string>
            <key>CFBundleExecutable</key><string>Lampion</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${version%%-*}</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # Unsigned build: an ad-hoc signature at least keeps Apple Silicon willing to launch it.
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "Lampion-${version}-${{ matrix.rid }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: Lampion-${{ matrix.rid }}
          path: |
            Lampion-*.zip
            Lampion-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
